# linux (server)
[settings]
experimental = true
registry_floating = true
auto_update = true
trusted_config_paths = ["[/]"]

[env]
FNOX_AGE_KEY_FILE = "~/.ssh/id_ed25519"
TERM = "xterm-256color"
EDITOR = "nano"
KUBE_EDITOR = "nano"
COMPOSE_BAKE = true
OP_RUN_NO_MASKING = true

HK_MISE = 1
UV_PREVIEW = 1
JUST_UNSTABLE = 1

[tools]
semver = "latest"
dust = "latest"
bottom = "latest"
gh = "latest"
bat = "latest"
eza = "latest"
jless = "latest"
fd = "latest"
rg = "latest"
jq = "latest"
yq = "latest"
jqp = "latest"
yazi = "latest"
zoxide = "latest"
starship = "latest"

chezmoi = "latest"
just = "latest"
fnox = "latest"
op = "latest"
powershell = "latest"
zellij = "latest"
television = "latest"
rclone = "latest"
aws-cli = "latest"
ruff = "latest"
shellcheck = "latest"

# linux (desktop)
[settings]
experimental = true
trusted_config_paths = ["[/]"]
auto_update = true
registry_floating = true

[env]
FNOX_AGE_KEY_FILE = "~/.ssh/id_ed25519"
TERM = "xterm-256color"
EDITOR = "nano"
KUBE_EDITOR = "nano"

# https://docs.pkgforge.dev/
# https://soar.qaidvoid.dev/quick-start

[defaults]
profile = "default"
binary_only = false

[packages]
ghostty = "*"
helium-browser = "*"
localsend = "*"
discord = "*"
btop = "*"

[packages.signal]
url = "https://updates.signal.org/desktop/signal-desktop.AppImage"
version = "v8.24.1"
pinned = true
version_command = "curl -qfsSL https://api.github.com/repos/signalapp/signal-desktop/releases/latest | jq -r '.tag_name'"

[packages.fluxer]
url = "https://api.canary.fluxer.app/dl/desktop/canary/linux/x64/latest/appimage"
version = "*"
version_command = "curl -qfsSLI https://api.canary.fluxer.app/dl/desktop/canary/linux/x64/latest/appimage | rg 'Fluxer.*Canary-(.*)-linux-x86_64.AppImage' -or '$1'"
#version_command = "curl -qfsSLI https://api.fluxer.app/dl/desktop/stable/linux/x64/latest/appimage | rg 'fluxer-stable-(.*)-x86_64.AppImage' -or '$1'"

[packages.kicad]
url = "https://mirrors.mit.edu/kicad/appimage/stable/kicad-{version}-x86_64.AppImage.tar"
hooks = {post_download = "7z x kicad"}
pinned = true
version = "10.0.5"
version_command = "curl -qfsSL https://api.github.com/repos/KiCad/kicad-source-mirror/releases/latest | rg -m 1 'kicad-(.*)-x86_64' -or '$1'"

[packages.arduino]
github = "arduino/arduino-ide"
asset_pattern = "arduino-ide_*_Linux_64bit.AppImage"
pinned = true
version = "2.3.8"

[packages.vscodium]
github = "vscodium/vscodium"
asset_pattern = "VSCodium-*.glibc*-x86_64.AppImage"
version = "1.126.04524"

[packages.prusaslicer]
github = "sarrchri/PrusaSlicer.AppImage"
asset_pattern = "PrusaSlicer-*-anylinux-x86_64.AppImage"
version = "2.9.6-2@2026-07-21_1784620859"

[packages.handy]
github = "cjpais/handy"
asset_pattern = "Handy_*_amd64.AppImage"
version = "0.9.5"

[packages.caligula]
github = "ifd3f/caligula"
asset_pattern = "caligula-x86_64-linux"
version = "0.5.0"

[packages.yaak]
github = "mountain-loop/yaak"
asset_pattern = "yaak_*_amd64.AppImage"
version = "2026.6.0"

[packages.stoat]
github = "stoatchat/for-desktop"
asset_pattern = "Stoat-*-anylinux-x86_64.AppImage"
version = "1.5.2"

[packages.avia]
github = "AvaLilac/for-desktop"
asset_pattern = "AviaClient-linux-x64.zip"
version = "1.8.4"
